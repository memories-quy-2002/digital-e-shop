name: Digital-E fixed CI verifier
description: Runs the reviewed client or server verification used by normal CI and Stage 1.
inputs:
  context:
    description: Required context to verify.
    required: true
  source-directory:
    description: Checkout directory containing client/ and server/.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.context == 'client' || inputs.context == 'server'
      with:
        version: 12.4.2
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.context == 'client'
      with:
        node-version: 24.20.0
        cache: pnpm
        cache-dependency-path: ${{ inputs.source-directory }}/client/pnpm-lock.yaml
    - name: Install client dependencies
      if: inputs.context == 'client'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/client
      run: pnpm install --frozen-lockfile
    - name: Typecheck client
      if: inputs.context == 'client'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/client
      run: pnpm exec tsc --noEmit
    - name: Lint client
      if: inputs.context == 'client'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/client
      run: pnpm lint
    - name: Test client
      if: inputs.context == 'client'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/client
      run: pnpm test -- --run
    - name: Build and smoke client
      if: inputs.context == 'client'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/client
      run: |
        set -euo pipefail
        pnpm build
        pnpm exec vite preview --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
        preview_pid=$!
        cleanup() { kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true; }
        trap cleanup EXIT
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
          sleep 1
        done
        cat preview.log
        exit 1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.context == 'server'
      with:
        node-version: 24.20.0
        cache: pnpm
        cache-dependency-path: ${{ inputs.source-directory }}/server/pnpm-lock.yaml
    - name: Install server dependencies
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: pnpm install --frozen-lockfile
    - name: Validate Prisma schema
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: pnpm prisma:validate
    - name: Verify MySQL connectivity
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: node -e 'const mysql=require("mysql2/promise"); mysql.createConnection(process.env.DATABASE_URL).then(async c=>{await c.query("SELECT 1"); await c.end();}).catch(e=>{console.error(e);process.exit(1);});'
    - name: Load legacy MySQL baseline and migrations
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: |
        set -euo pipefail
        node <<'NODE'
        const fs = require('node:fs');
        const mysql = require('mysql2/promise');
        const files = ['src/database/migrations/defaultdb_2026-06-01_142319.sql','src/database/migrations/2026-07-07-add-stripe-payment-support.sql'];
        (async()=>{const c=await mysql.createConnection({host:'127.0.0.1',port:3306,user:'root',password:'root',database:process.env.DB_NAME,multipleStatements:true});try{for(const file of files){const sql=fs.readFileSync(file,'utf8').replace(/SET @@GLOBAL\.GTID_PURGED=.*?;\s*/s,'');await c.query(sql);}}finally{await c.end();}})().catch(e=>{console.error(e);process.exit(1);});
        NODE
        pnpm prisma:migrate:resolve --applied 0_init
        set -o pipefail
        pnpm prisma:migrate:deploy 2>&1 | tee prisma-migrate.log
        pnpm prisma:migrate:status
    - name: Upload Prisma migration diagnostics
      if: failure() && inputs.context == 'server'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: prisma-migration-diagnostics
        path: ${{ inputs.source-directory }}/server/prisma-migrate.log
    - name: Typecheck server
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: pnpm typecheck
    - name: Lint server
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: pnpm lint
    - name: Test server
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: pnpm test -- --run
    - name: Integration tests
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      run: |
        set -o pipefail
        pnpm test:integration 2>&1 | tee integration-tests.log
    - name: Upload integration test diagnostics
      if: failure() && inputs.context == 'server'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: integration-test-diagnostics
        path: ${{ inputs.source-directory }}/server/integration-tests.log
    - name: Exercise destructive demo reset on disposable MySQL
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      env:
        DEMO_SEED_MODE: full-reset
        ALLOW_DESTRUCTIVE_DEMO_SEED: 'true'
        DEMO_SEED_CONFIRMATION: RESET_DEMO_DATABASE
      run: |
        set -euo pipefail
        pnpm demo:reset
        pnpm prisma:migrate:resolve --applied 0_init
        pnpm prisma:migrate:deploy
        pnpm prisma:seed
        pnpm demo:verify
        pnpm prisma:migrate:status
    - name: Build server function
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server/api
      run: pnpm run vercel-build
    - name: Verify server health
      if: inputs.context == 'server'
      shell: bash
      working-directory: ${{ inputs.source-directory }}/server
      env:
        NODE_ENV: test
        CLIENT_URL: http://localhost:5173
        SERVER_URL: http://localhost:4000
        FIREBASE_PROJECT_ID: demo-digital-e-local
        FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      run: |
        set -euo pipefail
        node dist/src/server.js > server-smoke.log 2>&1 &
        server_pid=$!
        cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
        trap cleanup EXIT
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error http://127.0.0.1:4000/api/health > /dev/null; then exit 0; fi
          sleep 1
        done
        cat server-smoke.log
        exit 1
