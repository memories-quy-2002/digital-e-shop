version: 2
updates:
  # This repository uses a pnpm workspace with one root pnpm-lock.yaml.
  # Keep Dependabot at the workspace root so dependency PRs update package.json
  # files and the shared lockfile together. Separate /client and /server jobs can
  # leave pnpm-lock.yaml stale, which breaks Vercel's frozen-lockfile install.
  #
  # Single npm update entry, single group, open-pull-requests-limit 1: every
  # outdated package (client + server + root) is bundled into one weekly PR.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "dependabot"
    groups:
      client-and-server-dependencies:
        patterns:
          - "*"
    # Framework majors need manual migration review (breaking API/behavior
    # changes); let Dependabot keep them on patch/minor per AGENTS.md guidance
    # to minimize lockfile churn and avoid unreviewed major bumps.
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # Separate ecosystem (Dependabot can't group across ecosystems into one
  # PR), but capped at 1 open PR — GitHub Action versions change far less
  # often than npm deps, so in practice this rarely opens alongside the npm
  # PR in the same week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    groups:
      github-actions:
        patterns:
          - "*"
