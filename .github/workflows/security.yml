name: Security

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # CodeQL is managed by GitHub repository default setup. Keeping an advanced
  # CodeQL upload here would conflict with that repository-level configuration.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
