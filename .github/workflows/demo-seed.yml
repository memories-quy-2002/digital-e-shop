name: Demo seed

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESET_DEMO_DATABASE to authorize the destructive reset
        required: true
        type: string
      backup_reference:
        description: Backup ID or timestamp verified before this run
        required: true
        type: string

concurrency:
  group: production-database-operation
  cancel-in-progress: false

jobs:
  reset-and-seed:
    name: reset-and-seed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL: ${{ secrets.DB_SSL }}
      NODE_ENV: production
      DEMO_SEED_MODE: full-reset
      ALLOW_DESTRUCTIVE_DEMO_SEED: 'true'
      DEMO_SEED_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate destructive reset authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "The destructive demo reset may only be dispatched from main."
            exit 1
          fi
          if [[ "$CONFIRMATION" != "RESET_DEMO_DATABASE" ]]; then
            echo "The confirmation must be exactly RESET_DEMO_DATABASE."
            exit 1
          fi
          if [[ -z "${BACKUP_REFERENCE//[[:space:]]/}" ]]; then
            echo "A verified backup reference is required before the destructive reset."
            exit 1
          fi
          echo "Destructive demo reset authorized after backup verification."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: 'pnpm'
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Reset selected database from committed legacy baseline
        working-directory: server
        run: pnpm demo:reset
      - name: Record Prisma legacy baseline
        working-directory: server
        run: pnpm prisma:migrate:resolve --applied 0_init
      - name: Apply forward Prisma migrations
        working-directory: server
        run: pnpm prisma:migrate:deploy
      - name: Run committed demo seed plan
        working-directory: server
        run: pnpm prisma:seed
      - name: Verify demo graph and counts
        working-directory: server
        run: pnpm demo:verify
      - name: Verify final Prisma migration status
        working-directory: server
        run: pnpm prisma:migrate:status
