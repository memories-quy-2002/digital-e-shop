name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: "placeholder"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter client exec tsc --noEmit

      - name: Lint
        run: pnpm --filter client lint

      - name: Test
        run: pnpm --filter client test -- --run

      - name: Build
        run: pnpm --filter client build

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: "mysql://user:password@localhost:3306/digital_e_shop_ci"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter server typecheck

      - name: Lint
        run: pnpm --filter server lint

      - name: Test
        run: pnpm --filter server test -- --run

      - name: Build
        run: pnpm --filter server build
