name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: https://e-commerce-express-server-app.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shared client verifier
        uses: ./.github/actions/stage1-verify
        with:
          context: client
          source-directory: .
  server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digital_e_shop_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci_user -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/digital_e_shop_ci"
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: digital_e_shop_ci
      JWT_SECRET_KEY: ci-access-secret
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret
      CSRF_SECRET: ci-csrf-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run shared server verifier
        uses: ./.github/actions/stage1-verify
        with:
          context: server
          source-directory: .
  production-migrate:
    name: production-migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - client
      - server
    runs-on: ubuntu-24.04
    environment:
      name: production
    concurrency:
      group: production-database-operation
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: 'pnpm'
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Apply production Prisma migrations
        working-directory: server
        run: pnpm prisma:migrate:deploy
      - name: Verify production Prisma migration status
        working-directory: server
        run: pnpm prisma:migrate:status
