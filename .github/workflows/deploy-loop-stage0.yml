name: Hosted Loop Stage 0

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-loop-stage0.yml'
      - 'scripts/loop/**'
      - 'docs/loop-engineering/**'
      - 'Wiki/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-loop-stage0.yml'
      - 'scripts/loop/**'
      - 'docs/loop-engineering/**'
      - 'Wiki/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hosted-loop-stage0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install the Stage 0 package
        run: pnpm --dir scripts/loop/hosted/cloudflare install --frozen-lockfile

      - name: Run the Worker tests
        run: pnpm --dir scripts/loop/hosted/cloudflare test

      - name: Typecheck the Worker
        run: pnpm --dir scripts/loop/hosted/cloudflare typecheck

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: hosted-stage0-production
    permissions:
      contents: read
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the pinned Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.2

      - name: Install the Stage 0 package
        run: pnpm --dir scripts/loop/hosted/cloudflare install --frozen-lockfile

      - name: Deploy the production Worker
        working-directory: scripts/loop/hosted/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler deploy --env production --strict
