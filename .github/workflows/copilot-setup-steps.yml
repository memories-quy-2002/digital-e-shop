name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create client env file
        run: |
          echo "VITE_API_URL=http://localhost:3000" > client/.env

      - name: Create server env file
        env:
          DATABASE_URL: ${{ secrets.COPILOT_MCP_MYSQL_URL }}
        run: |
          echo "DATABASE_URL=${DATABASE_URL}" > server/.env
          echo "JWT_SECRET_KEY=test-secret-for-agent-sandbox" >> server/.env
          echo "JWT_REFRESH_SECRET_KEY=test-refresh-secret-for-agent-sandbox" >> server/.env

      - name: Typecheck client
        run: pnpm --filter client exec tsc --noEmit
        continue-on-error: true
