name: Refresh production hardening lockfile

on:
  push:
    branches:
      - codex/production-hardening

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/production-hardening
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: 'pnpm'
      - name: Regenerate workspace lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/refresh-production-hardening-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile after hardening merge"
          git push origin HEAD:codex/production-hardening
