name: Loop source SHA probe

on:
  workflow_run:
    workflows: ["Loop Foundation"]
    types: [completed]

permissions:
  actions: read
  contents: read
  attestations: read
  pull-requests: read

jobs:
  probe:
    if: github.repository == 'memories-quy-2002/digital-e-shop'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      attestations: read
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Verify upstream workflow source attestation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/loop/stage1-source-sha-probe-cli.mjs
