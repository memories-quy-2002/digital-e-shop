packages:
  - "client"
  - "server"
minimumReleaseAge: 1440
allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  geckodriver: false
  msw: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - tsx@4.22.4
overrides:
  "@prisma/adapter-mariadb>mariadb": 3.4.7
  "prisma>mysql2": 3.24.3
  "@prisma/config>deepmerge-ts": 8.0.0
