<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Digital-E Shop</title>
  <desc id="desc">Dark navy and electric-blue Digital-E banner with an illustrated commerce dashboard and product cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081326"/>
      <stop offset="55%" stop-color="#101c3b"/>
      <stop offset="100%" stop-color="#132c4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
