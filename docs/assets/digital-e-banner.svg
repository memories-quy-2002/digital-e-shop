    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172a48"/>
      <stop offset="100%" stop-color="#0e1b34"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#95c7ff" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <clipPath id="canvas"><rect width="1200" height="350" rx="24"/></clipPath>
  </defs>
