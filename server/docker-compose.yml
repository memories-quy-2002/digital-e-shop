services:
    mysql:
        image: mysql:8.0
        container_name: digitale-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-digital_e_root}
            MYSQL_DATABASE: ${DB_NAME:-digital_e_shop_local}
            MYSQL_ROOT_HOST: "%"
        ports:
            - "${DB_PORT:-3307}:3306"
        volumes:
            - digital_e_shop_local_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-digital_e_root}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_general_ci
            --default-authentication-plugin=mysql_native_password
            --default-time-zone=+00:00
    redis:
        image: redis:7-alpine
        container_name: digital-e-redis
        restart: unless-stopped
        ports:
            - "127.0.0.1:${REDIS_PORT:-6379}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
    otel-lgtm:
        image: grafana/otel-lgtm:0.30.1
        container_name: digital-e-otel-lgtm
        profiles: ["observability"]
        restart: unless-stopped
        volumes:
            - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/digital-e.yaml:ro
            - ./observability/grafana/digital-e-operations.json:/otel-lgtm/grafana/conf/provisioning/dashboards/digital-e/digital-e-operations.json:ro
        ports:
            - "127.0.0.1:3000:3000"
            - "127.0.0.1:4317:4317"
            - "127.0.0.1:4318:4318"

volumes:
    digital_e_shop_local_mysql_data:
        name: digital_e_shop_local_mysql_data
