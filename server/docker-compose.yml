services:
    mysql:
        image: mysql:8.0
        container_name: digitale-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-digital_e_root}
            MYSQL_DATABASE: ${DB_NAME:-digital_e_shop_local}
            MYSQL_ROOT_HOST: "%"
        ports:
            - "${DB_PORT:-3307}:3306"
        volumes:
            - digital_e_shop_local_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-digital_e_root}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_general_ci
            --default-authentication-plugin=mysql_native_password
            --default-time-zone=+00:00

volumes:
    digital_e_shop_local_mysql_data:
        name: digital_e_shop_local_mysql_data
